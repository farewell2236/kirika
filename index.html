<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IIDX SP☆12 OPTION MANAGER</title>
<style>
:root{--bg:#070a11;--panel:#111827;--panel2:#182235;--line:#2d3a50;--text:#eef5ff;--muted:#98a8bc;--cyan:#25d9ff;--orange:#ff9c2b;--danger:#ff8492}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#05070c,#111a2b);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:10;padding:8px;background:rgba(7,10,17,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
h1{font-size:16px;margin:0 0 6px;color:var(--cyan)}
.controls{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:6px}
button,input,select{min-height:34px;padding:5px 8px;border:1px solid #35455e;border-radius:8px;background:#111a29;color:var(--text);font-size:14px}
button{font-weight:700;cursor:pointer}.mode.active{background:#073c4b;border-color:var(--cyan)}
#status{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.45}#status.error{color:var(--danger)}
main{max-width:1100px;margin:auto;padding:8px}.summary{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.badge{padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.group{margin-bottom:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.group-title{width:100%;display:flex;justify-content:space-between;border:0;border-radius:0;background:linear-gradient(90deg,#182235,#101725);padding:7px 10px}
.group-title strong{color:var(--orange)}.group.closed .rows{display:none}.rows{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:6px}
.row{display:grid;grid-template-columns:1fr;gap:4px;align-items:stretch;padding:7px;border:1px solid #26354a;border-radius:8px;min-width:0}
.row:hover{filter:brightness(1.08)}
.title{font-weight:650;overflow-wrap:anywhere;font-size:12px;line-height:1.25;min-height:30px}
.option-select,.clear-select{width:100%;min-height:28px;padding:2px 5px;font-size:11px}
.column-head{display:grid;grid-template-columns:minmax(260px,1fr) 140px 140px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid #202c40;background:#0d1522;color:var(--muted);font-size:12px;font-weight:700}
.column-head .option-head{color:#25d9ff;text-align:center}
.column-head .clear-head{color:#ff5aa5;text-align:center}
.field-label{display:block;color:var(--muted);font-size:10px;font-weight:700;margin-bottom:2px}
.row.failed{background:#5f6368;color:#fff}
.row.assist{background:#7e57c2;color:#fff}
.row.easy{background:#2e7d32;color:#fff}
.row.clear{background:#4dd0e1;color:#000}
.row.hard{background:#c62828;color:#fff}
.row.exhard{background:#fdd835;color:#000}
.row.fullcombo{background:#fb8c00;color:#000}
.row.clear select,.row.exhard select,.row.fullcombo select{color:#eef5ff}
.lamp-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px}
.lamp-unset{background:#111827;border:1px solid #5b6b82}
.lamp-failed{background:#5f6368}
.lamp-assist{background:#7e57c2}
.lamp-easy{background:#2e7d32}
.lamp-clear{background:#4dd0e1}
.lamp-hard{background:#c62828}
.lamp-exhard{background:#fdd835}
.lamp-fullcombo{background:#fb8c00}
.empty{text-align:center;padding:55px 10px;color:var(--muted)}
@media(max-width:700px){
.controls{grid-template-columns:1fr 1fr}
.controls input{grid-column:1/-1}
.column-head{display:none}
.row{grid-template-columns:1fr;padding:6px;gap:4px}
.field-wrap{display:block}
.field-label{display:block;color:var(--muted);font-size:11px;font-weight:700}
.option-select,.clear-select{width:100%;min-height:28px;padding:2px 5px;font-size:11px}
h1{font-size:16px}
}
@media(min-width:701px){.field-wrap{display:block}}

@media(max-width:1100px) and (min-width:851px){.rows{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:850px) and (min-width:601px){.rows{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.rows{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:5px}}
@media(max-width:420px){.rows{grid-template-columns:1fr}}

</style>
</head>
<body>
<header>
<h1>IIDX SP☆12 OPTION MANAGER</h1>
<div class="controls">
<button id="normalBtn" class="mode active">ノマゲ難易度表</button>
<button id="hardBtn" class="mode">ハード難易度表</button>
<input id="search" type="search" placeholder="曲名検索">
<select id="clearFilter"></select>
<button id="refreshBtn">曲データ更新</button>
</div>
<div id="status">SP☆12専用データを準備中…</div>
</header>
<main><div id="summary" class="summary"></div><div id="app" class="empty">準備中です</div></main>
<footer style="max-width:1100px;margin:auto;padding:0 14px 20px;color:var(--muted);font-size:12px">楽曲データ参照元：sp12.iidx.app（SP☆12のみ）</footer>
<script>
const DATA_URL='./data/sp12.json';
const CACHE_KEY='iidx_sp12_only_sheet_cache_v7';
const OPT_KEY='iidx_sp12_options_v3';
const MODE_KEY='iidx_sp12_mode_v3';
const OPTIONS=['未設定','正規','MIRROR','RANDOM','R-RANDOM','S-RANDOM','H-RANDOM'];
const CLEARS=['未設定','FAILED','ASSIST','EASY','CLEAR','HARD','EX HARD','FULLCOMBO'];
const CLEAR_KEY='iidx_sp12_clear_v1';
const ORDER=['地力S+','個人差S+','地力S','個人差S','地力A+','個人差A+','地力A','個人差A','地力B+','個人差B+','地力B','個人差B','地力C','個人差C','地力D','個人差D','地力E','個人差E','地力F','個人差F','未分類'];
const $=s=>document.querySelector(s);
const clean=s=>String(s??'').replace(/\s+/g,' ').trim();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode=localStorage.getItem(MODE_KEY)||'normal';
let options=JSON.parse(localStorage.getItem(OPT_KEY)||'{}');
let clears=JSON.parse(localStorage.getItem(CLEAR_KEY)||'{}');
let songs=JSON.parse(localStorage.getItem(CACHE_KEY)||'[]');

function status(t,e=false){$('#status').className=e?'error':'';$('#status').textContent=t}
function save(){localStorage.setItem(OPT_KEY,JSON.stringify(options));localStorage.setItem(CLEAR_KEY,JSON.stringify(clears));localStorage.setItem(MODE_KEY,mode)}
function optKey(s){return mode+'::'+s.title+'::'+(s.chart||'')}
function getOpt(s){return options[optKey(s)]||'未設定'}
function normalizeRank(v){
  const s=clean(v);
  if(!s||s==='null'||s==='-')return '未分類';
  if(ORDER.includes(s))return s;
  const m=s.match(/(個人差|地力)?\s*([A-FS])(\+)?/i);
  if(m)return (m[1]||'地力')+m[2].toUpperCase()+(m[3]||'');
  return '未分類';
}
function pick(o,names){for(const n of names)if(o&&o[n]!=null)return o[n];return null}
function transform(raw){
 const arr=Array.isArray(raw)?raw:(raw.sheets||raw.data||[]);
 const rows=arr.map(x=>{
   const title=clean(pick(x,['title','music_title','name','song_name']));
   const ver=clean(pick(x,['version','ver','series']))||'-';
    const chart=clean(pick(x,['chart','difficulty_name','difficulty','sheet_type','style']))||'';
   const normal=normalizeRank(pick(x,['n_clear_string','normal_string','normal','normal_rank']));
   const hard=normalizeRank(pick(x,['hard_string','hard','hard_rank']));
   return {title,chart,ver,normal,hard,level:12,source:'sp12.iidx.app'};
 }).filter(x=>x.title&&x.level===12);
 const seen=new Set();
 return rows.filter(x=>{const key=x.title+'\0'+x.ver;if(seen.has(key))return false;seen.add(key);return true});
}
async function fetchSheetData(){
 const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});
 if(!r.ok)throw new Error('data/sp12.json HTTP '+r.status);
 const data=await r.json();
 const parsed=transform(data);
 if(parsed.length<100)throw new Error('data/sp12.jsonの曲数が不足（'+parsed.length+'件）');
 return {parsed,url:DATA_URL,updatedAt:data.updatedAt||''};
}
async function load(force=false){
 status('GitHub上の最新SP☆12データを確認中…');
 try{
  const {parsed,url,updatedAt}=await fetchSheetData();
  songs=parsed;
  localStorage.setItem(CACHE_KEY,JSON.stringify(songs));
  render();
  status(`取得完了：SP☆12 ${songs.length}譜面${updatedAt?'（更新 '+updatedAt+'）':''}`);
 }catch(e){
  if(songs.length){
   render();
   status('最新データを取得できなかったため、保存済みデータを表示しています：'+e.message,true);
  }else{
   render();
   status('SP☆12データの読み込みに失敗しました：'+e.message,true);
  }
 }
}
function clearClass(v){
 switch(v){
  case 'FAILED': return 'failed';
  case 'ASSIST': return 'assist';
  case 'EASY': return 'easy';
  case 'CLEAR': return 'clear';
  case 'HARD': return 'hard';
  case 'EX HARD': return 'exhard';
  case 'FULLCOMBO': return 'fullcombo';
  default:return '';
 }
}
function clearDotClass(v){
 switch(v){
  case 'FAILED': return 'lamp-failed';
  case 'ASSIST': return 'lamp-assist';
  case 'EASY': return 'lamp-easy';
  case 'CLEAR': return 'lamp-clear';
  case 'HARD': return 'lamp-hard';
  case 'EX HARD': return 'lamp-exhard';
  case 'FULLCOMBO': return 'lamp-fullcombo';
  default:return 'lamp-unset';
 }
}
function isLeggendaria(s){
 const values=[s.chart,s.difficulty,s.difficulty_name,s.sheet_type]
  .map(v=>String(v??'').trim());
 return values.some(v=>
  /LEGGENDARIA|LEGENDARIA/i.test(v) ||
  v==='4' || v.toUpperCase()==='L'
 );
}

function currentList(){
 return songs.map(s=>({...s,rank:mode==='normal'?s.normal:s.hard}));
}
function render(){
 $('#normalBtn').classList.toggle('active',mode==='normal');
 $('#hardBtn').classList.toggle('active',mode==='hard');

 const list=currentList();
 const q=clean($('#search').value).toLowerCase();
 const f=$('#clearFilter').value;
 const shown=list.filter(s=>
  (!q||s.title.toLowerCase().includes(q)) &&
  (!f||(clears[optKey(s)]||'未設定')===f)
 );

 const groups=new Map(ORDER.map(r=>[r,[]]));
 shown.forEach(s=>(groups.get(s.rank)||groups.get('未分類')).push(s));

 $('#app').className='';
 $('#app').innerHTML=[...groups]
  .filter(([,a])=>a.length)
  .map(([rank,a])=>`<section class="group">
   <button class="group-title">
    <strong>${esc(rank)}</strong>
    <span>${a.length}譜面 ▾</span>
   </button>
   <div class="rows">${a
    .sort((x,y)=>x.title.localeCompare(y.title,'ja'))
    .map(s=>{
     const key=optKey(s);
     const clear=clears[key]||'未設定';
     return `<div class="row ${clearClass(clear)}">
      <span class="title">${esc(s.title)}${isLeggendaria(s)?' †':''}</span>
      <div class="field-wrap">
       <span class="field-label">オプション</span>
       <select class="option-select" aria-label="オプション" data-key="${esc(key)}">
        ${OPTIONS.map(o=>`<option${getOpt(s)===o?' selected':''}>${o}</option>`).join('')}
       </select>
      </div>
      <div class="field-wrap">
       <span class="field-label">クリアランプ</span>
       <select class="clear-select" aria-label="クリアランプ" data-key="${esc(key)}">
        ${CLEARS.map(c=>`<option${clear===c?' selected':''}>${c}</option>`).join('')}
       </select>
      </div>
     </div>`;
    }).join('')}</div>
  </section>`)
  .join('') ||
  (songs.length
   ?'<div class="empty">該当曲なし</div>'
   :'<div class="empty">曲データがありません。「曲データ更新」を押してください。</div>');

 document.querySelectorAll('.group-title').forEach(
  b=>b.onclick=()=>b.parentElement.classList.toggle('closed')
 );
 document.querySelectorAll('.option-select').forEach(
  s=>s.onchange=()=>{
   options[s.dataset.key]=s.value;
   save();
   render();
  }
 );
 document.querySelectorAll('.clear-select').forEach(
  s=>s.onchange=()=>{
   clears[s.dataset.key]=s.value;
   save();
   render();
  }
 );

 $('#summary').innerHTML=
  `<span class="badge">全 ${list.length}譜面</span>`+
  CLEARS.map(c=>
   `<span class="badge"><span class="lamp-dot ${clearDotClass(c)}"></span>${c}: ${list.filter(s=>(clears[optKey(s)]||'未設定')===c).length}</span>`
  ).join('');
}

function switchMode(m){mode=m;save();render()}
$('#normalBtn').onclick=()=>switchMode('normal');$('#hardBtn').onclick=()=>switchMode('hard');
$('#search').oninput=render;$('#clearFilter').onchange=render;$('#refreshBtn').onclick=()=>load(true);
$('#clearFilter').innerHTML='<option value="">全クリアランプ</option>'+CLEARS.map(c=>`<option>${c}</option>`).join('');
['iidx_sp12_only_sheet_cache_v3','iidx_sp12_only_sheet_cache_v4','iidx_sp12_only_sheet_cache_v5','iidx_sp12_only_sheet_cache_v6'].forEach(k=>localStorage.removeItem(k));
render();load(false);
</script>
</body>
</html>
<style>.column-head{display:none!important}
@media(max-width:1100px) and (min-width:851px){.rows{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:850px) and (min-width:601px){.rows{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.rows{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:5px}}
@media(max-width:420px){.rows{grid-template-columns:1fr}}

</style>
