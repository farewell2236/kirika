name: Update SP12 data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: write

concurrency:
  group: update-sp12-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser and browser
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 curl_cffi playwright
          python -m playwright install --with-deps chromium

      - name: Fetch full SP12 master and classifications
        run: python scripts/update_songs.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/sp12.json data/update-report.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sp12.json data/update-report.json
          git commit -m "Update full SP12 data and classifications"
          git pull --rebase origin main
          git push origin HEAD:main
